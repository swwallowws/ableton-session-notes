name: Links

# Every link in the README still answers, weekly: CI checks them on every push,
# but the sites and pages they point at can move in between.
on:
  schedule:
    - cron: "49 6 * * 1"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  links:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: lycheeverse/lychee-action@v2
        with:
          args: --no-progress --exclude-loopback --max-retries 3 --accept 200,206,429 README.md

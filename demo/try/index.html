<!doctype html>
<html lang="en" data-category="workflow">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Session Notes: guided walkthrough</title>
  <link rel="stylesheet" href="../vendor/design/tokens.css">
  <link rel="stylesheet" href="../vendor/design/steprail.css">
  <link rel="stylesheet" href="../vendor/design/demoshell.css">
  <link rel="stylesheet" href="try.css">
  <script>
    // Set the mode before first paint: ?theme=paper|night (from the showcase
    // frame) wins; otherwise the system scheme applies. The demo shell
    // handles ?embed=1.
    (function () {
      var t = new URLSearchParams(location.search).get("theme");
      if (t === "paper" || t === "night") document.documentElement.dataset.theme = t;
    })();
  </script>
</head>
<body>
  <main id="demo">
    <div class="live">
      <section class="pane note">
        <div class="pane-bar">
          <span class="cap">Note</span>
          <span id="count" class="mut small"></span>
        </div>
        <textarea id="md" spellcheck="false" aria-label="Note text (Markdown)"></textarea>
        <ol id="lines" hidden></ol>
      </section>

      <section class="pane arrangement">
        <div class="pane-bar">
          <span class="cap">Arrangement</span>
          <span role="group" aria-label="Send as" class="seg">
            <button type="button" data-mode="locators" aria-pressed="true">Locators</button>
            <button type="button" data-mode="clips" aria-pressed="false">Clips</button>
          </span>
        </div>
        <div id="timeline" class="timeline" role="img" aria-label="Mock Ableton Live arrangement showing where the line lands, with a bar row and a seconds row"></div>
      </section>
    </div>
    <p class="after mut small" id="after" hidden><a href="../">Open the playground</a></p>
  </main>

  <script src="try.js"></script>
</body>
</html>
